# Ready-made builds for Windows, Linux and macOS, attached to a GitHub Release.
#
# - Push a tag "v<version>" (the version in src/reversehire/_version.py): builds,
#   smoke-tests and publishes the release for that tag.
# - "Run workflow" by hand: builds and smoke-tests; the packages are kept as workflow
#   artifacts. Tick "publish" to also create or update the release v<version>.
#
# The builds are NOT code-signed (no certificate): see docs/INSTALLATION.md.

name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Create or update the release v<version> with the packages"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # One Python for every build: all dependencies (PySide6, onnxruntime, rapidocr,
  # tokenizers, lingua, numpy...) have wheels for it on the three targets, and it
  # is the version the test suite runs on.
  PYTHON_VERSION: "3.14"
  PYINSTALLER_SPEC: tools/packaging/reversehire.spec

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-22.04        # glibc 2.35: runs on Ubuntu 22.04+, Debian 12+, Fedora 36+
            platform: linux-x86_64
          - os: macos-15            # Apple Silicon (arm64) only; no Intel build
            platform: macos-arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Read the version
        id: version
        run: |
          version=$(python -c "import re,pathlib; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('src/reversehire/_version.py').read_text()).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/}" != "v$version" ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} does not match the version $version in _version.py"
            exit 1
          fi

      - name: Linux system libraries (Qt, Qt WebEngine, virtual X server)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libegl1 libgl1 libopengl0 libglib2.0-0 libfontconfig1 libfreetype6 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libxcb-xkb1 \
            libxcb-glx0 libxcb-shm0 libxcb-sync1 libxcb-util1 libx11-xcb1 \
            libnss3 libnspr4 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 libxshmfence1 \
            libgbm1 libdrm2 libasound2 libpulse0 libcups2 libgl1-mesa-dri libglx-mesa0

      - name: Install the project and PyInstaller
        run: |
          python -m pip install --upgrade pip
          extra=""
          # macOS: OpenCV 5.1 wheels need macOS 15; keep the build at macOS 14 like PySide6.
          if [ "$RUNNER_OS" = "macOS" ]; then extra="opencv-python-headless<5.1"; fi
          python -m pip install ".[mcp]" "pyinstaller>=6.16" $extra
          python -m pip list

      - name: Build with PyInstaller
        run: python -m PyInstaller "$PYINSTALLER_SPEC" --noconfirm --distpath dist --workpath build/pyinstaller

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: python tools/packaging/smoke.py dist/ReverseHire/ReverseHire.exe

      - name: Smoke test (Linux, under a virtual X server)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: "1"   # the virtual X server has no GPU: Mesa's software renderer
        run: |
          echo "Highest glibc symbol version needed:"
          find dist/ReverseHire -type f \( -name '*.so*' -o -name reversehire \) -exec objdump -T {} + 2>/dev/null \
            | grep -o 'GLIBC_[0-9.]*' | sort -u -V | tail -1
          xvfb-run -a -s "-screen 0 1600x1000x24 +extension GLX" python tools/packaging/smoke.py dist/ReverseHire/reversehire

      - name: Diagnosis after a failed Linux smoke test (offscreen instead of X11)
        if: failure() && runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tools/packaging/smoke.py dist/ReverseHire/reversehire || true
          echo "=== The same self-test from the installed sources (not frozen), under X11 ==="
          QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x1000x24 +extension GLX" \
            python -X faulthandler -m reversehire --self-test --self-test-report source-selftest.json || true
          cat source-selftest.json || true

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          python tools/packaging/macos_minos.py dist/ReverseHire.app --max 14.0 \
            || echo "::warning::Some files need a newer macOS than 14.0 (see the list above)"
          python tools/packaging/smoke.py dist/ReverseHire.app/Contents/MacOS/ReverseHire --expect-program-folder none

      - name: Package (Windows zip and installer)
        if: runner.os == 'Windows'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p packages
          cp LICENSE dist/ReverseHire/LICENSE.txt
          cp tools/packaging/THIRD-PARTY-NOTICES.txt dist/ReverseHire/
          cp -r tools/packaging/licenses dist/ReverseHire/licenses
          (cd dist && 7z a -tzip -mx=7 "../packages/ReverseHire-$VERSION-windows-x64.zip" ReverseHire > /dev/null)
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -x "$ISCC" ]; then
            choco install innosetup --no-progress -y || echo "::warning::Inno Setup not installed: no installer"
          fi
          if [ -x "$ISCC" ]; then
            "$ISCC" -Q "-DAppVersion=$VERSION" "-DSourceDir=$(cygpath -w "$PWD/dist/ReverseHire")" \
              "-DOutputDir=$(cygpath -w "$PWD/packages")" tools/packaging/windows/reversehire.iss \
              || echo "::warning::The installer could not be built: the zip is published alone"
          fi
          ls -l packages

      - name: Package (Linux tar.gz)
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p packages
          cp tools/packaging/linux/reversehire.desktop dist/ReverseHire/
          cp tools/packaging/linux/install-desktop-entry.sh dist/ReverseHire/
          chmod +x dist/ReverseHire/install-desktop-entry.sh dist/ReverseHire/reversehire
          cp src/reversehire/resources/icon_256.png dist/ReverseHire/reversehire.png
          cp LICENSE dist/ReverseHire/LICENSE.txt
          cp tools/packaging/THIRD-PARTY-NOTICES.txt dist/ReverseHire/
          cp -r tools/packaging/licenses dist/ReverseHire/licenses
          tar -C dist -czf "packages/ReverseHire-$VERSION-linux-x86_64.tar.gz" ReverseHire
          ls -l packages

      - name: Package (macOS disk image)
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p packages dmg
          ditto dist/ReverseHire.app dmg/ReverseHire.app
          ln -s /Applications dmg/Applications
          cp LICENSE dmg/LICENSE.txt
          cp tools/packaging/THIRD-PARTY-NOTICES.txt dmg/
          cp -r tools/packaging/licenses dmg/licenses
          for attempt in 1 2 3; do
            hdiutil create -volname "ReverseHire $VERSION" -srcfolder dmg -ov -format UDZO \
              "packages/ReverseHire-$VERSION-macos-arm64.dmg" && break
            echo "hdiutil failed (attempt $attempt), retrying"; sleep 10
          done
          test -f "packages/ReverseHire-$VERSION-macos-arm64.dmg"
          ls -l packages

      - uses: actions/upload-artifact@v5
        with:
          name: package-${{ matrix.platform }}
          path: packages/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish the release
    needs: build
    # Also when one platform failed: the platforms that built and passed are published.
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v6
        with:
          pattern: package-*
          path: packages
          merge-multiple: true

      - name: Checksums and notes
        id: prepare
        run: |
          version=$(python3 -c "import re,pathlib; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('src/reversehire/_version.py').read_text()).group(1))")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          ls packages/* >/dev/null 2>&1 || { echo "::error::No package was built"; exit 1; }
          (cd packages && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          sed "s/@VERSION@/$version/g" tools/packaging/release_notes.md > notes.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" packages/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" packages/* --title "ReverseHire ${TAG#v}" \
              --notes-file notes.md --generate-notes --target "$GITHUB_SHA"
          fi
          gh release view "$TAG"
