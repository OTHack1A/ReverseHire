# Diagnosis of the web-map crash on Linux and macOS (run by hand, from the sources).
# Runs tools/packaging/map_repro.py: the map check with each application-wide event
# filter of the app installed alone, with an empty Python filter, and with none.

name: Map diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: Map repro ${{ matrix.os }} ${{ matrix.qpa }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            qpa: xcb
          - os: ubuntu-22.04
            qpa: offscreen
          - os: macos-15
            qpa: offscreen
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libegl1 libgl1 libopengl0 libglib2.0-0 libfontconfig1 libfreetype6 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libxcb-xkb1 \
            libxcb-glx0 libxcb-shm0 libxcb-sync1 libxcb-util1 libx11-xcb1 \
            libnss3 libnspr4 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 libxshmfence1 \
            libgbm1 libdrm2 libasound2 libpulse0 libcups2 libgl1-mesa-dri libglx-mesa0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          extra=""
          if [ "$RUNNER_OS" = "macOS" ]; then extra="opencv-python-headless<5.1"; fi
          python -m pip install ".[mcp]" $extra
      - name: Repro
        env:
          QT_QPA_PLATFORM: ${{ matrix.qpa }}
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1600x1000x24 +extension GLX" python tools/packaging/map_repro.py
          else
            python tools/packaging/map_repro.py
          fi
